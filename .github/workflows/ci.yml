name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    name: lint + build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Habilitar corepack (Yarn 4)
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Instalar dependencias
        run: yarn install --immutable

      - name: Lint (incluye reglas de boundaries entre módulos)
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test
