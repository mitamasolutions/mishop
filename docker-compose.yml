services:
  postgres:
    image: postgres:16-alpine
    container_name: mitama-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mitama
      POSTGRES_PASSWORD: mitama
      POSTGRES_DB: mitama
    ports:
      - "5432:5432"
    volumes:
      - mitama_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mitama -d mitama"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mitama_pgdata:
